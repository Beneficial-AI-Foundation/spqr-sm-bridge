weak.linter.style.headerAlt.license = "Released under MIT license as described in the file LICENSE."

[[require]]
name = "Spqr"
git = "https://github.com/Beneficial-AI-Foundation/SparsePostQuantumRatchet-verify.git"
rev = "b1be65b2d9b110aa43ed4c6034ebaed00ce26d0d"

[[require]]
name = "SecureMessaging"
git = "https://github.com/Beneficial-AI-Foundation/secure-messaging.git"
rev = "19964e720e3b015e5f01f2c7fd067984cd0f8bd3"

[[lean_lib]]
name = "SpqrBridge"
